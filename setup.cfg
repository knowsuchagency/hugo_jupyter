[metadata]
name = hugo_jupyter
version = 1.0.3
description = Use Jupyter notebooks to publish with Hugo.
long_description = file: README.rst
author = Stephan Fitzpatrick
author_email = knowsuchagency@gmail.com
url = https://github.com/knowsuchagency/hugo_jupyter
license = MIT license
keywords = hugo_jupyter
classifiers =
    Development Status :: 2 - Pre-Alpha
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3

[options]
zip_safe = False
include_package_data = True
packages = find:
python_requires = >=3.8
install_requires =
    crayons
    docopt
    fab-classic
    nbconvert
    nbformat
    notebook
    watchdog

[options.packages.find]
exclude =
    tests

[options.extras_require]
dev =
    pytest

[options.entry_points]
console_scripts =
    hugo_jupyter = hugo_jupyter.cli:main

[flake8]
exclude = docs
